name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Quality gate — content, SEO and assets must be intact
        run: |
          test -f dist/CNAME || (echo "CNAME missing — custom domain would break" && exit 1)
          test -f dist/assets/UzairCV.pdf || (echo "Resume PDF missing" && exit 1)
          grep -q "9+ years" dist/index.html || (echo "Core content missing from HTML" && exit 1)
          grep -q 'meta name="description"' dist/index.html || (echo "Meta description missing" && exit 1)
          grep -q 'application/ld+json' dist/index.html || (echo "JSON-LD missing" && exit 1)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
